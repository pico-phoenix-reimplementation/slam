plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.lynx.orbslamservice'
    compileSdk 34

    defaultConfig {
        applicationId "com.lynx.orbslamservice"
        minSdk 30
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                cppFlags ""
                arguments "-DANDROID_STL=c++_shared"
            }
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildFeatures {
        viewBinding true
        aidl true
    }

    sourceSets {
        main {
            jniLibs.srcDirs = [
                'src/main/jniLibs',
                "${projectDir}/external/jniLibs"
            ]
            aidl.srcDirs = ['src/main/aidl']
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    def externalDir = file("${projectDir}/external")
    def dspDir = file("${externalDir}/orbslam3lib/dsp")

    task buildDspHexagon(type: Exec) {
        description = "Build and sign DSP library for Hexagon"

        workingDir dspDir
        commandLine 'cmd', '/c', 'buildAndSignDspLib.bat'

        standardInput = new ByteArrayInputStream("y\n".getBytes())
        standardOutput = System.out
        errorOutput = System.err

        doFirst {
            println "--- Starting Hexagon build process ---"
        }

        doLast {
            println "--- External Hexagon build process finished ---"
        }
    }

    preBuild.dependsOn buildDspHexagon

    task cleanDspHexagon(type: Delete) {
        delete "${dspDir}/hexagon_Release_toolv87_v66", "${dspDir}/output"
    }

    clean.dependsOn cleanDspHexagon
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    runtimeOnly files("external/qxr/qxrcoreservice.aar")
}